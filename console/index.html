<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>comgirlservices › console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #c8c8d4;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
            border-radius: 12px 12px 0 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .header h1 span { color: #6c5ce7; }
        .header .badge {
            background: rgba(108, 92, 231, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #a29bfe;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }
        .header .badge .count { color: #fff; font-weight: 600; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.4;
        }
        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
        }
        .stat-card .value.green { color: #00b894; }
        .stat-card .value.red { color: #ff6b6b; }
        .stat-card .value.yellow { color: #fdcb6e; }
        .stat-card .value.blue { color: #74b9ff; }
        .table-container {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 600px;
        }
        thead { background: rgba(255, 255, 255, 0.04); }
        th {
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .ip-cell {
            font-family: 'Courier New', monospace;
            color: #81ecec;
            font-size: 13px;
            font-weight: 600;
        }
        .flag-icon { font-size: 18px; margin-right: 4px; vertical-align: middle; }
        .timestamp { font-size: 11px; opacity: 0.5; font-family: 'Courier New', monospace; }
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .status-badge.local {
            background: rgba(108, 92, 231, 0.2);
            color: #a29bfe;
        }
        .footer {
            margin-top: 20px;
            padding: 12px 16px;
            text-align: center;
            font-size: 11px;
            opacity: 0.3;
            letter-spacing: 0.5px;
        }
        .refresh-btn {
            background: rgba(108, 92, 231, 0.15);
            border: 1px solid rgba(108, 92, 231, 0.2);
            color: #a29bfe;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }
        .refresh-btn:hover { background: rgba(108, 92, 231, 0.25); }
        .loading-text { text-align: center; opacity: 0.4; padding: 30px; }
        .empty-state {
            text-align: center;
            opacity: 0.4;
            padding: 40px;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state .title { font-size: 18px; color: #fff; margin-bottom: 8px; }
        .empty-state .sub { font-size: 13px; }
        .clear-btn {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }
        .clear-btn:hover { background: rgba(255, 107, 107, 0.25); }
        @media (max-width: 768px) {
            body { padding: 12px; }
            .header { padding: 12px 16px; }
            .stats { grid-template-columns: 1fr 1fr; }
            table { font-size: 11px; min-width: 400px; }
            th, td { padding: 8px 10px; }
            .ip-cell { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>⌨️ comgirlservices / <span>console</span></h1></div>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <span class="badge">💾 <span class="count" id="ipCount">0</span> IPs in localStorage</span>
            <button class="refresh-btn" onclick="loadIPs()">⟳ Refresh</button>
            <button class="clear-btn" onclick="clearIPs()">🗑️ Clear All</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="label">Total IPs</div><div class="value blue" id="totalIPs">0</div></div>
        <div class="stat-card"><div class="label">Unique IPs</div><div class="value green" id="uniqueIPs">0</div></div>
        <div class="stat-card"><div class="label">Today's Visits</div><div class="value yellow" id="todayCount">0</div></div>
        <div class="stat-card"><div class="label">Most Recent</div><div class="value" id="recentIP" style="font-size:16px; font-family:'Courier New',monospace;">-</div></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr><th>IP Address</th><th>Location</th><th>ISP</th><th>First Seen</th><th>Last Seen</th></tr>
            </thead>
            <tbody id="ipTableBody">
                <tr><td colspan="5" class="loading-text">Loading IPs from localStorage...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">comgirlservices · security console · all IPs stored locally in your browser</div>

    <script>
        // ─── STORAGE HELPERS ───
        function getStoredIPs() {
            try {
                const data = localStorage.getItem('visitor_ips');
                return data ? JSON.parse(data) : [];
            } catch {
                return [];
            }
        }

        function saveIPs(ips) {
            localStorage.setItem('visitor_ips', JSON.stringify(ips));
        }

        function clearIPs() {
            if (confirm('⚠️ Delete all stored IPs?')) {
                localStorage.removeItem('visitor_ips');
                loadIPs();
                showToast('🗑️ All IPs cleared', 'info');
            }
        }

        function showToast(message, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ─── LOAD AND DISPLAY IPs ───
        function loadIPs() {
            const tbody = document.getElementById('ipTableBody');
            const ips = getStoredIPs();

            if (ips.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="5">
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <div class="title">No IPs logged yet</div>
                            <div class="sub">Visit the video page to log your IP</div>
                        </div>
                    </td></tr>
                `;
                updateStats(ips);
                return;
            }

            // Sort by lastSeen (newest first)
            const sorted = [...ips].sort((a, b) => 
                new Date(b.lastSeen) - new Date(a.lastSeen)
            );

            tbody.innerHTML = '';
            sorted.forEach(entry => {
                const row = document.createElement('tr');
                const flag = '🌐';
                const firstSeen = new Date(entry.firstSeen);
                const lastSeen = new Date(entry.lastSeen);

                row.innerHTML = `
                    <td class="ip-cell"><span class="flag-icon">${flag}</span> ${entry.ip}</td>
                    <td>${entry.location || 'Unknown'}</td>
                    <td>${entry.isp || 'Unknown'}</td>
                    <td class="timestamp">${firstSeen.toLocaleString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
                    <td class="timestamp">${lastSeen.toLocaleString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
                `;
                tbody.appendChild(row);
            });

            updateStats(ips);
        }

        function updateStats(ips) {
            const total = ips.length;
            const unique = new Set(ips.map(i => i.ip)).size;
            const today = ips.filter(i => {
                const date = new Date(i.lastSeen);
                const now = new Date();
                return date.getDate() === now.getDate() &&
                       date.getMonth() === now.getMonth() &&
                       date.getFullYear() === now.getFullYear();
            }).length;

            document.getElementById('totalIPs').textContent = total;
            document.getElementById('uniqueIPs').textContent = unique;
            document.getElementById('todayCount').textContent = today;
            document.getElementById('ipCount').textContent = total;

            if (ips.length > 0) {
                const sorted = [...ips].sort((a, b) => new Date(b.lastSeen) - new Date(a.lastSeen));
                document.getElementById('recentIP').textContent = sorted[0].ip;
                document.getElementById('recentIP').style.color = '#00ff88';
            } else {
                document.getElementById('recentIP').textContent = '-';
                document.getElementById('recentIP').style.color = '#c8c8d4';
            }
        }

        // ─── AUTO-REFRESH EVERY 10 SECONDS ───
        setInterval(loadIPs, 10000);

        // ─── LOAD ON START ───
        loadIPs();

        // ─── LOG ───
        console.log('[Security Console] Local storage monitoring active');
        console.log('[Security Console] Total IPs:', getStoredIPs().length);
    </script>
</body>
</html>
