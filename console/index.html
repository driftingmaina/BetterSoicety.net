<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>comgirlservices › security console</title>
    <style>
        /* ── Reset ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #c8c8d4;
            min-height: 100vh;
            padding: 20px;
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
            border-radius: 12px 12px 0 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .header h1 span {
            color: #6c5ce7;
        }
        .header .badge {
            background: rgba(108, 92, 231, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #a29bfe;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }
        .header .badge .count {
            color: #fff;
            font-weight: 600;
        }

        /* ── Stats ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.4;
        }
        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
        }
        .stat-card .value.green { color: #00b894; }
        .stat-card .value.red { color: #ff6b6b; }
        .stat-card .value.yellow { color: #fdcb6e; }

        /* ── Table ── */
        .table-container {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 600px;
        }
        thead {
            background: rgba(255, 255, 255, 0.04);
        }
        th {
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .ip-cell {
            font-family: 'Courier New', monospace;
            color: #81ecec;
            font-size: 13px;
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .status-badge.trusted {
            background: rgba(0, 184, 148, 0.2);
            color: #00b894;
        }
        .status-badge.suspicious {
            background: rgba(253, 203, 110, 0.2);
            color: #fdcb6e;
        }
        .status-badge.blocked {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        .flag-icon {
            font-size: 18px;
            margin-right: 4px;
            vertical-align: middle;
        }
        .timestamp {
            font-size: 11px;
            opacity: 0.5;
            font-family: 'Courier New', monospace;
        }

        .footer {
            margin-top: 20px;
            padding: 12px 16px;
            text-align: center;
            font-size: 11px;
            opacity: 0.3;
            letter-spacing: 0.5px;
        }

        /* ── Refresh button ── */
        .refresh-btn {
            background: rgba(108, 92, 231, 0.15);
            border: 1px solid rgba(108, 92, 231, 0.2);
            color: #a29bfe;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            background: rgba(108, 92, 231, 0.25);
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .header { padding: 12px 16px; }
            .stats { grid-template-columns: 1fr 1fr; }
            table { font-size: 11px; min-width: 400px; }
            th, td { padding: 8px 10px; }
            .ip-cell { font-size: 11px; }
        }
    </style>
</head>
<body>

    <!-- ─── HEADER ─── -->
    <div class="header">
        <div>
            <h1>⌨️ comgirlservices / <span>console</span></h1>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <span class="badge">🛡️ <span class="count" id="ipCount">0</span> public IPs</span>
            <button class="refresh-btn" onclick="loadIPs()">⟳ Refresh</button>
        </div>
    </div>

    <!-- ─── STATS ─── -->
    <div class="stats">
        <div class="stat-card">
            <div class="label">Total Public IPs</div>
            <div class="value" id="totalIPs">0</div>
        </div>
        <div class="stat-card">
            <div class="label">✅ Trusted</div>
            <div class="value green" id="trustedCount">0</div>
        </div>
        <div class="stat-card">
            <div class="label">⚠️ Suspicious</div>
            <div class="value yellow" id="suspiciousCount">0</div>
        </div>
        <div class="stat-card">
            <div class="label">🚫 Blocked</div>
            <div class="value red" id="blockedCount">0</div>
        </div>
    </div>

    <!-- ─── IP TABLE ─── -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Public IP</th>
                    <th>Location</th>
                    <th>ISP</th>
                    <th>Status</th>
                    <th>Last Seen</th>
                </tr>
            </thead>
            <tbody id="ipTableBody">
                <tr><td colspan="5" style="text-align:center; opacity:0.4; padding:30px;">Loading IPs...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        comgirlservices · security console · all public IPs logged
    </div>

    <script>
        // ─── PUBLIC IP DATA ───
        // In production, this would be fetched from your backend API
        // which stores the public IPs collected from visitors.

        let ipData = [];

        async function loadIPs() {
            // ─── FOR DEMO: Generate sample public IPs ───
            // In production, replace with:
            // const response = await fetch('/api/security/ips');
            // ipData = await response.json();

            // Simulate public IPs (random for demo)
            const publicIPs = [
                { ip: '203.0.113.42', city: 'New York', region: 'NY', country: 'US', countryCode: 'US', isp: 'Comcast Cable', status: 'trusted', lastSeen: '2025-01-15 14:32:21' },
                { ip: '198.51.100.78', city: 'London', region: 'England', country: 'UK', countryCode: 'GB', isp: 'Sky Broadband', status: 'suspicious', lastSeen: '2025-01-15 13:12:08' },
                { ip: '45.33.22.11', city: 'Moscow', region: 'MOW', country: 'Russia', countryCode: 'RU', isp: 'Rostelecom', status: 'blocked', lastSeen: '2025-01-15 10:45:33' },
                { ip: '8.8.8.8', city: 'Mountain View', region: 'CA', country: 'USA', countryCode: 'US', isp: 'Google LLC', status: 'trusted', lastSeen: '2025-01-14 16:30:15' },
                { ip: '104.28.12.95', city: 'Frankfurt', region: 'HE', country: 'Germany', countryCode: 'DE', isp: 'Cloudflare', status: 'trusted', lastSeen: '2025-01-14 14:22:09' },
                { ip: '185.165.29.12', city: 'Amsterdam', region: 'NH', country: 'Netherlands', countryCode: 'NL', isp: 'Leaseweb', status: 'suspicious', lastSeen: '2025-01-13 22:01:44' },
                { ip: '94.23.45.67', city: 'Paris', region: 'IDF', country: 'France', countryCode: 'FR', isp: 'OVH', status: 'blocked', lastSeen: '2025-01-13 18:50:02' },
                { ip: '172.217.14.206', city: 'Sydney', region: 'NSW', country: 'Australia', countryCode: 'AU', isp: 'Google Australia', status: 'trusted', lastSeen: '2025-01-13 12:15:33' },
                { ip: '13.107.4.52', city: 'Seattle', region: 'WA', country: 'USA', countryCode: 'US', isp: 'Microsoft Azure', status: 'trusted', lastSeen: '2025-01-12 09:20:17' },
                { ip: '190.2.3.4', city: 'Buenos Aires', region: 'B', country: 'Argentina', countryCode: 'AR', isp: 'Telecom Argentina', status: 'suspicious', lastSeen: '2025-01-11 20:15:44' },
            ];

            ipData = publicIPs;
            renderTable(ipData);
        }

        // ─── RENDER TABLE ───
        function renderTable(ips) {
            const tbody = document.getElementById('ipTableBody');
            if (!ips || ips.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; opacity:0.4; padding:30px;">No IPs logged yet</td></tr>`;
                return;
            }

            tbody.innerHTML = '';

            const statusLabels = {
                trusted: '✅ Trusted',
                suspicious: '⚠️ Suspicious',
                blocked: '🚫 Blocked'
            };

            const statusColors = {
                trusted: 'trusted',
                suspicious: 'suspicious',
                blocked: 'blocked'
            };

            ips.forEach(entry => {
                const row = document.createElement('tr');

                // Flag emoji
                const flag = entry.countryCode ?
                    String.fromCodePoint(...[...entry.countryCode.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🌐';

                const location = [entry.city, entry.region, entry.country].filter(Boolean).join(', ') || 'Unknown';

                row.innerHTML = `
                    <td class="ip-cell"><span class="flag-icon">${flag}</span> ${entry.ip}</td>
                    <td>${location}</td>
                    <td>${entry.isp || 'Unknown'}</td>
                    <td><span class="status-badge ${statusColors[entry.status] || 'suspicious'}">${statusLabels[entry.status] || 'Unknown'}</span></td>
                    <td class="timestamp">${entry.lastSeen}</td>
                `;
                tbody.appendChild(row);
            });

            // Update stats
            const total = ips.length;
            const trusted = ips.filter(i => i.status === 'trusted').length;
            const suspicious = ips.filter(i => i.status === 'suspicious').length;
            const blocked = ips.filter(i => i.status === 'blocked').length;

            document.getElementById('totalIPs').textContent = total;
            document.getElementById('trustedCount').textContent = trusted;
            document.getElementById('suspiciousCount').textContent = suspicious;
            document.getElementById('blockedCount').textContent = blocked;
            document.getElementById('ipCount').textContent = total;
        }

        // ─── LOAD ON START ───
        loadIPs();

        console.log('[Security Console] Public IP monitoring active');
    </script>
</body>
</html>
