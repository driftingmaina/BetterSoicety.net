<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>comgirlservices › console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #c8c8d4;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
            border-radius: 12px 12px 0 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; color: #fff; }
        .header h1 span { color: #6c5ce7; }
        .header .badge {
            background: rgba(108, 92, 231, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #a29bfe;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }
        .header .badge .count { color: #fff; font-weight: 600; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.4; }
        .stat-card .value { font-size: 22px; font-weight: 700; color: #fff; margin-top: 4px; }
        .stat-card .value.green { color: #00b894; }
        .stat-card .value.red { color: #ff6b6b; }
        .stat-card .value.yellow { color: #fdcb6e; }
        .stat-card .value.blue { color: #74b9ff; }
        .table-container {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        thead { background: rgba(255, 255, 255, 0.04); }
        th {
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        td { padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .ip-cell { font-family: 'Courier New', monospace; color: #81ecec; font-size: 13px; font-weight: 600; }
        .flag-icon { font-size: 18px; margin-right: 4px; vertical-align: middle; }
        .timestamp { font-size: 11px; opacity: 0.5; font-family: 'Courier New', monospace; }
        .footer {
            margin-top: 20px;
            padding: 12px 16px;
            text-align: center;
            font-size: 11px;
            opacity: 0.3;
            letter-spacing: 0.5px;
        }
        .refresh-btn {
            background: rgba(108, 92, 231, 0.15);
            border: 1px solid rgba(108, 92, 231, 0.2);
            color: #a29bfe;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }
        .refresh-btn:hover { background: rgba(108, 92, 231, 0.25); }
        .loading-text { text-align: center; opacity: 0.4; padding: 30px; }
        .empty-state { text-align: center; opacity: 0.4; padding: 40px; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state .title { font-size: 18px; color: #fff; margin-bottom: 8px; }
        .refresh-indicator {
            font-size: 11px;
            opacity: 0.3;
            margin-left: 8px;
        }
        @media (max-width: 768px) {
            body { padding: 12px; }
            .header { padding: 12px 16px; }
            .stats { grid-template-columns: 1fr 1fr; }
            table { font-size: 11px; min-width: 400px; }
            th, td { padding: 8px 10px; }
            .ip-cell { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>⌨️ comgirlservices / <span>console</span></h1></div>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <span class="badge">🐙 <span class="count" id="ipCount">0</span> visitors logged</span>
            <button class="refresh-btn" onclick="loadIPs()">⟳ Refresh</button>
            <span class="refresh-indicator" id="refreshTime">Last updated: -</span>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="label">Total Visitors</div><div class="value blue" id="totalIPs">0</div></div>
        <div class="stat-card"><div class="label">Unique IPs</div><div class="value green" id="uniqueIPs">0</div></div>
        <div class="stat-card"><div class="label">Today's Visitors</div><div class="value yellow" id="todayCount">0</div></div>
        <div class="stat-card"><div class="label">Most Recent</div><div class="value" id="recentIP" style="font-size:16px; font-family:'Courier New',monospace;">-</div></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr><th>IP Address</th><th>Location</th><th>ISP</th><th>Issue #</th><th>Timestamp</th></tr>
            </thead>
            <tbody id="ipTableBody">
                <tr><td colspan="5" class="loading-text">Loading visitors from GitHub Issues...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer">comgirlservices · security console · all IPs stored in GitHub Issues</div>

    <script>
        // ============================================================
        // YOUR REPO INFO
        // ============================================================
        const GITHUB_REPO = 'mania828/BetterSoicety.net';
        // ============================================================

        let cachedData = [];

        // ─── FETCH ALL ISSUES FROM GITHUB ───
        async function fetchGitHubIssues() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_REPO}/issues?labels=visitor,security-log&state=all&per_page=100&sort=created&direction=desc`,
                    {
                        headers: {
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const issues = await response.json();
                return issues;
            } catch (error) {
                console.error('Failed to fetch issues:', error);
                throw error;
            }
        }

        // ─── PARSE ISSUES INTO IP DATA ───
        function parseIssuesToIPs(issues) {
            return issues.map(issue => {
                // Extract IP from title: "Visitor: 123.45.67.89"
                const ipMatch = issue.title.match(/Visitor: ([\d.]+)/);
                const ip = ipMatch ? ipMatch[1] : 'Unknown';

                // Extract location and ISP from body
                const body = issue.body || '';
                const locationMatch = body.match(/\|\*\*Location\*\* \| (.*?)\n/);
                const ispMatch = body.match(/\|\*\*ISP\*\* \| (.*?)\n/);

                return {
                    ip: ip,
                    location: locationMatch ? locationMatch[1].trim() : 'Unknown',
                    isp: ispMatch ? ispMatch[1].trim() : 'Unknown',
                    issueNumber: issue.number,
                    timestamp: issue.created_at,
                    issueUrl: issue.html_url
                };
            });
        }

        // ─── RENDER TABLE ───
        function renderTable(ips) {
            const tbody = document.getElementById('ipTableBody');

            if (ips.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="5">
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <div class="title">No visitors logged yet</div>
                            <div class="sub">Visit the video page to log your IP</div>
                        </div>
                    </td></tr>
                `;
                return;
            }

            tbody.innerHTML = '';
            ips.forEach(entry => {
                const row = document.createElement('tr');
                const flag = '🌐';
                const date = new Date(entry.timestamp);

                row.innerHTML = `
                    <td class="ip-cell"><span class="flag-icon">${flag}</span> ${entry.ip}</td>
                    <td>${entry.location}</td>
                    <td>${entry.isp}</td>
                    <td><a href="${entry.issueUrl}" target="_blank" style="color:#a29bfe; text-decoration:none;">#${entry.issueNumber}</a></td>
                    <td class="timestamp">${date.toLocaleString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' })}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // ─── UPDATE STATS ───
        function updateStats(ips) {
            const total = ips.length;
            const unique = new Set(ips.map(i => i.ip)).size;
            const today = ips.filter(i => {
                const date = new Date(i.timestamp);
                const now = new Date();
                return date.getDate() === now.getDate() &&
                       date.getMonth() === now.getMonth() &&
                       date.getFullYear() === now.getFullYear();
            }).length;

            document.getElementById('totalIPs').textContent = total;
            document.getElementById('uniqueIPs').textContent = unique;
            document.getElementById('todayCount').textContent = today;
            document.getElementById('ipCount').textContent = total;

            if (ips.length > 0) {
                const sorted = [...ips].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                document.getElementById('recentIP').textContent = sorted[0].ip;
                document.getElementById('recentIP').style.color = '#00ff88';
            } else {
                document.getElementById('recentIP').textContent = '-';
                document.getElementById('recentIP').style.color = '#c8c8d4';
            }

            document.getElementById('refreshTime').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        }

        // ─── LOAD IPs ───
        async function loadIPs() {
            const tbody = document.getElementById('ipTableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="loading-text">Loading visitors from GitHub Issues...</td></tr>`;

            try {
                const issues = await fetchGitHubIssues();
                const ipData = parseIssuesToIPs(issues);
                cachedData = ipData;
                renderTable(ipData);
                updateStats(ipData);

                console.log(`[+] Loaded ${ipData.length} visitors from GitHub Issues`);

            } catch (error) {
                tbody.innerHTML = `
                    <tr><td colspan="5" style="text-align:center; opacity:0.4; padding:30px;">
                        ❌ Failed to load visitors: ${error.message}<br>
                        <small>Make sure the repo exists and issues are public</small>
                    </td></tr>
                `;
                console.error('Failed to load IPs:', error);
            }
        }

        // ─── AUTO-REFRESH EVERY 30 SECONDS ───
        setInterval(loadIPs, 30000);

        // ─── LOAD ON START ───
        loadIPs();

        console.log('[Security Console] Monitoring visitors via GitHub Issues');
        console.log(`[Security Console] Repo: ${GITHUB_REPO}`);
    </script>
</body>
</html>
