<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        
        body {
            background: #000;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Background Video - No Blur, Higher Brightness */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            z-index: -100;
            transform: translate(-50%, -50%);
            filter: brightness(0.6); /* Adjusted for visibility */
            object-fit: cover;
            display: block;
        }

        /* Entry Overlay - Force Interaction */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        #overlay p { letter-spacing: 5px; font-weight: 300; color: #fff; animation: breathe 2s infinite; }

        @keyframes breathe { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Solid Square Card */
        .glass-card {
            background: rgba(10, 10, 10, 0.9); /* Solid, less transparent */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 40px;
            width: 380px;
            height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        .pfp {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1.5px; }
        .description { color: #71717a; font-size: 0.8rem; margin-bottom: 25px; }

        /* Presence Area */
        .presence {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            width: 100%;
            margin-bottom: 25px;
        }

        #album-art { width: 45px; height: 45px; border-radius: 4px; display: none; }
        .presence-info { display: flex; flex-direction: column; overflow: hidden; }
        .track-name { font-weight: 600; font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { color: #a1a1aa; font-size: 0.75rem; }

        /* Social Icons */
        .icon-links { display: flex; gap: 30px; }
        .icon-link { color: rgba(255, 255, 255, 0.5); font-size: 1.5rem; transition: 0.3s; }
        .icon-link:hover { color: #fff; transform: scale(1.1); }

        #status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: #22c55e; }
        .dnd { background: #ef4444; }
        .idle { background: #eab308; }
    </style>
</head>
<body>

    <div id="overlay" onclick="enterSite()">
        <p>[ JOIN BETTERSOCIETY NOW! ]</p>
    </div>

    <video loop id="bg-video" preload="auto">
        <source src="ssstik.io_1778806504322.mp4" type="video/mp4">
    </video>

    <div class="glass-card">
        <img src="ᥫ᭡.jpg"" class="pfp">
        <h1>Society</h1>
        <p class="description">Join better society NOW! and i am a white hat hacker, social engineer </p>

        <div class="presence">
            <img id="album-art" src="" alt="">
            <div class="presence-info">
                <span id="track" class="track-name">Not Playing</span>
                <span id="artist" class="artist-name">Spotify</span>
                <div style="margin-top: 4px; font-size: 0.65rem; color: #52525b;">
                    <div id="status-dot"></div> <span id="status-text">OFFLINE</span>
                </div>
            </div>
        </div>

        <div class="icon-links">
            <a href="https://discord.com/users/1470202416237641769" class="icon-link" target="_blank"><i class="fa-brands fa-discord"></i></a>
            <a href="https://github.com/mania828" class="icon-link" target="_blank"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="icon-link" target="_blank"><i class="fa-brands fa-telegram"></i></a>
        </div>
    </div>

    <script>
        const USER_ID = "1470202416237641769";
        const video = document.getElementById('bg-video');

        function enterSite() {
            const overlay = document.getElementById('overlay');
            overlay.classList.add('hidden');
            
            // Force reset and play
            video.currentTime = 0;
            video.muted = false;
            
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Playback failed. Ensure your file is named background.mp4");
                });
            }
        }

        // Lanyard Real-time
        const socket = new WebSocket('wss://api.lanyard.rest/socket');
        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.op === 1) {
                socket.send(JSON.stringify({ op: 2, d: { subscribe_to_id: USER_ID } }));
                setInterval(() => socket.send(JSON.stringify({ op: 3 })), msg.d.heartbeat_interval);
            }
            if (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE') {
                const d = msg.d;
                document.getElementById('status-dot').className = d.discord_status;
                document.getElementById('status-text').innerText = d.discord_status.toUpperCase();
                if (d.listening_to_spotify) {
                    document.getElementById('track').innerText = d.spotify.track;
                    document.getElementById('artist').innerText = d.spotify.artist;
                    const art = document.getElementById('album-art');
                    art.src = d.spotify.album_art_url;
                    art.style.display = 'block';
                } else {
                    document.getElementById('track').innerText = "Nothing Playing";
                    document.getElementById('artist').innerText = "Spotify";
                    document.getElementById('album-art').style.display = 'none';
                }
            }
        };
    </script>
</body>
</html>
