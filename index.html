<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Society Client</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050505;
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .container { text-align: center; }
  .tagline {
    font-size: 52px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }
  .client-word {
    color: #8A2BE2; /* Aesthetic Purple */
    display: inline-block;
    transition: color 0.2s ease;
  }
  .spinning {
    animation: slotSpin 0.08s linear infinite;
    filter: blur(1.5px);
  }
  @keyframes slotSpin {
    0% { transform: translateY(0); opacity: 1; }
    50% { transform: translateY(-5px); opacity: 0.3; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .status {
    font-size: 12px;
    color: #444;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="tagline" onclick="rollText()">
      <span>SOCIETY</span>
      <span class="client-word" id="clientWord">CLIENT</span>
    </div>
    <div class="status">COMING SOON</div>
  </div>

  <script>
    const words = ['CLIENT', 'SYSTEM', 'ELITE', 'FUTURE', 'POWER', 'ACCESS', 'NODE', 'FLOW', 'BETA', 'READY'];
    let rolling = false;

    function rollText() {
      if (rolling) return;
      rolling = true;
      const el = document.getElementById('clientWord');
      el.classList.add('spinning');
      
      let count = 0;
      let totalSpins = 20;

      function spin() {
        el.textContent = words[Math.floor(Math.random() * words.length)];
        count++;
        
        if (count >= totalSpins) {
          el.classList.remove('spinning');
          el.textContent = 'CLIENT';
          rolling = false;
          return;
        }
        setTimeout(spin, 50 + (count * 5));
      }
      spin();
    }
  </script>
</body>
</html>
