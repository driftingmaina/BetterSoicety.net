<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        /* Remove all margins, padding, and scrolling */
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;  /* fills screen without stretching */
            display: block;
        }
    </style>
</head>
<body>
    <!-- autoplay + loop + muted (required for autoplay in most browsers) -->
    <video src="yo.mp4" autoplay loop muted playsinline></video>
</body>
</html>
