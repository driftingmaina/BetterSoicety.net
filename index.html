<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video</title>
    <style>
        /* ── Reset ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        video {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
        #clickOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            background: transparent;
        }
        /* ── Public IP Info Overlay ── */
        #ipInfo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 20px;
            color: #fff;
            font-size: 12px;
            line-height: 1.6;
            min-width: 200px;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        #ipInfo .ip-label {
            opacity: 0.4;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }
        #ipInfo .ip-value {
            font-weight: 700;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            color: #00ff88;
            letter-spacing: 0.5px;
        }
        #ipInfo .ip-detail {
            opacity: 0.6;
            font-size: 11px;
            margin-top: 2px;
        }
        #ipInfo .ip-flag {
            display: inline-block;
            margin-right: 6px;
            font-size: 16px;
        }
        #ipInfo.loading .ip-value {
            color: #888;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #00ff88;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* ── Security watermark (optional) ── */
        .security-badge {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 15;
            font-size: 10px;
            opacity: 0.15;
            color: #fff;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <video id="myVideo" src="yo.mp4" autoplay playsinline loop></video>
    <div id="clickOverlay"></div>

    <!-- Public IP Overlay -->
    <div id="ipInfo" class="loading">
        <div class="ip-label">🌐 Your Public IP</div>
        <div class="ip-value" id="ipDisplay"><span class="spinner"></span>Fetching...</div>
        <div class="ip-detail" id="locationDisplay">Loading location...</div>
        <div class="ip-detail" id="ispDisplay"></div>
    </div>

    <div class="security-badge">● SECURE CONNECTION</div>

    <script>
        // ─── VIDEO CONTROLS ───
        const video = document.getElementById('myVideo');
        const overlay = document.getElementById('clickOverlay');

        video.play().catch(() => {
            overlay.style.display = 'block';
        });

        overlay.addEventListener('click', () => {
            video.play();
            overlay.style.display = 'none';
        });

        document.addEventListener('click', () => {
            if (video.paused) video.play();
        });

        // ─── FETCH PUBLIC IP ───
        const ipDisplay = document.getElementById('ipDisplay');
        const locationDisplay = document.getElementById('locationDisplay');
        const ispDisplay = document.getElementById('ispDisplay');
        const ipInfo = document.getElementById('ipInfo');

        async function fetchPublicIP() {
            try {
                // ipapi.co returns public IP, location, ISP, etc.
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                // Build location string
                const locParts = [];
                if (data.city) locParts.push(data.city);
                if (data.region) locParts.push(data.region);
                if (data.country_name) locParts.push(data.country_name);
                const location = locParts.join(', ') || 'Unknown location';

                // Flag emoji (simple mapping)
                const flag = data.country_code ? 
                    String.fromCodePoint(...[...data.country_code.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '';

                // Update UI
                ipDisplay.innerHTML = `${flag} ${data.ip || 'Unknown'}`;
                ipDisplay.style.color = '#00ff88';
                locationDisplay.textContent = `📍 ${location}`;
                ispDisplay.textContent = data.org || data.isp || '';

                ipInfo.classList.remove('loading');

                // ─── LOG PUBLIC IP FOR SECURITY ───
                const logEntry = {
                    ip: data.ip,
                    location: location,
                    isp: data.org || data.isp,
                    country: data.country_name,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent
                };

                console.log('[Security] Public IP logged:', logEntry);

                // In production, send this to your server:
                // await fetch('/api/log-visit', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify(logEntry)
                // });

            } catch (error) {
                console.error('IP fetch failed:', error);
                ipDisplay.textContent = '⚠️ Unable to fetch';
                ipDisplay.style.color = '#ff6644';
                locationDisplay.textContent = 'IP service unavailable';
                ispDisplay.textContent = 'Check your connection';
                ipInfo.classList.remove('loading');
            }
        }

        fetchPublicIP();
    </script>
</body>
</html>
