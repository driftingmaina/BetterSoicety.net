<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video</title>
    <style>
        /* Remove all margins, padding, scrollbars */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        video {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
        /* Transparent overlay to catch first click */
        #clickOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            background: transparent;
        }
        /* IP info overlay - bottom right, glass effect */
        #ipInfo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 18px;
            color: #fff;
            font-size: 12px;
            line-height: 1.6;
            min-width: 180px;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        #ipInfo .ip-label {
            opacity: 0.5;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #ipInfo .ip-value {
            font-weight: 600;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            color: #00ff88;
        }
        #ipInfo .ip-detail {
            opacity: 0.7;
            font-size: 11px;
        }
        #ipInfo.loading {
            opacity: 0.5;
        }
        /* Loading spinner for IP */
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #00ff88;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <video id="myVideo" src="yo.mp4" autoplay playsinline loop></video>
    <div id="clickOverlay"></div>

    <!-- IP Info Overlay -->
    <div id="ipInfo" class="loading">
        <div class="ip-label">Your Location Info</div>
        <div class="ip-value" id="ipDisplay"><span class="spinner"></span>Fetching...</div>
        <div class="ip-detail" id="locationDisplay">Loading location...</div>
        <div class="ip-detail" id="ispDisplay"></div>
    </div>

    <script>
        // ---------- VIDEO CONTROLS ----------
        const video = document.getElementById('myVideo');
        const overlay = document.getElementById('clickOverlay');

        // Try to autoplay (may be blocked by browser)
        video.play().catch(() => {
            overlay.style.display = 'block';
        });

        overlay.addEventListener('click', () => {
            video.play();
            overlay.style.display = 'none';
        });

        document.addEventListener('click', () => {
            if (video.paused) {
                video.play();
            }
        });

        // ---------- IP API INTEGRATION ----------
        const ipDisplay = document.getElementById('ipDisplay');
        const locationDisplay = document.getElementById('locationDisplay');
        const ispDisplay = document.getElementById('ispDisplay');
        const ipInfo = document.getElementById('ipInfo');

        async function fetchIPInfo() {
            try {
                // Using ipapi.co (free, no API key required)
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                // Update UI
                ipDisplay.textContent = data.ip || 'Unknown';
                ipDisplay.style.color = '#00ff88';

                const locationParts = [];
                if (data.city) locationParts.push(data.city);
                if (data.region) locationParts.push(data.region);
                if (data.country_name) locationParts.push(data.country_name);
                if (data.postal) locationParts.push(data.postal);

                locationDisplay.textContent = locationParts.join(', ') || 'Location unknown';
                ispDisplay.textContent = data.org || data.isp || '';

                ipInfo.classList.remove('loading');

                // Log for security (in a real app, send to server)
                console.log('[Security] IP logged:', {
                    ip: data.ip,
                    location: locationParts.join(', '),
                    isp: data.org,
                    timestamp: new Date().toISOString()
                });

            } catch (error) {
                console.error('IP fetch failed:', error);
                ipDisplay.textContent = '⚠️ Unable to fetch';
                ipDisplay.style.color = '#ff6644';
                locationDisplay.textContent = 'IP service unavailable';
                ipInfo.classList.remove('loading');
            }
        }

        // Fetch IP info on load
        fetchIPInfo();
    </script>
</body>
</html>
